name: Fixture checks
on: [push, pull_request]
jobs:
  local-mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make setup PYTHON=python3
      - run: make test
      - run: make check
      - run: make demo
      - run: make privacy-check
# No model weights, secrets, generative provider requests or paid evaluation in CI.
